<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings | HoloNova</title>

<link rel="stylesheet"
href="/static/css/style.css">

</head>

<body>

<nav class="navbar">

<div class="logo">🚀 HoloNova</div>

<ul class="nav-links">

<li><a href="/">Home</a></li>
<li><a href="/upload-page">Upload</a></li>
<li><a href="/dashboard">Dashboard</a></li>
<li><a href="/gallery">Gallery</a></li>
<li><a href="/settings">Settings</a></li>

</ul>

</nav>

<section class="dashboard">

<h1>Settings</h1>

<div class="upload-card">

<label>ESP32 IP Address</label>

<input
type="text"
id="espIp"
placeholder="192.168.1.100">

<br><br>

<label>LED Brightness</label>

<input
type="range"
id="brightness"
min="0"
max="255"
value="128">

<p id="brightnessValue">128</p>

<label>Rotation Speed</label>

<input
type="range"
id="speed"
min="1"
max="20"
value="10">

<p id="speedValue">10</p>

<label>LED Count</label>

<input
type="number"
id="ledCount"
value="128">

<br><br>

<button id="saveBtn">

Save Settings

</button>

<p id="status"></p>

</div>

</section>

<script src="/static/js/settings.js"></script>

</body>

</html>
