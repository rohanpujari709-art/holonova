<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HoloNova - Hologram Studio</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #050816;

            color:
                #ffffff;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            width: 100%;

            padding:
                20px 30px;

            background:
                #0a1025;

            border-bottom:
                1px solid #1f315c;

            text-align:
                center;

        }


        header h1 {

            margin:
                0;

            font-size:
                32px;

            color:
                #38bdf8;

            letter-spacing:
                2px;

        }


        header p {

            margin:
                8px 0 0;

            color:
                #94a3b8;

            font-size:
                15px;

        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        main {

            width:
                100%;

            max-width:
                1200px;

            margin:
                0 auto;

            padding:
                30px 20px;

        }


        /* =====================================================
           SECTION
        ===================================================== */

        section {

            margin-bottom:
                30px;

            padding:
                25px;

            background:
                #0b1228;

            border:
                1px solid #1e3a5f;

            border-radius:
                14px;

            box-shadow:
                0 10px 30px rgba(
                    0,
                    0,
                    0,
                    0.25
                );

        }


        section h2 {

            margin-top:
                0;

            margin-bottom:
                20px;

            color:
                #38bdf8;

            font-size:
                24px;

        }


        /* =====================================================
           UPLOAD AREA
        ===================================================== */

        .upload-area {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            gap:
                15px;

            text-align:
                center;

        }


        .upload-area p {

            margin:
                0;

            color:
                #cbd5e1;

        }


        /* =====================================================
           FILE INPUT
        ===================================================== */

        #fileInput {

            width:
                100%;

            max-width:
                500px;

            padding:
                12px;

            background:
                #111a35;

            color:
                #ffffff;

            border:
                1px solid #334c75;

            border-radius:
                8px;

            cursor:
                pointer;

        }


        #fileInput:hover {

            border-color:
                #38bdf8;

        }


        /* =====================================================
           FILE INFORMATION
        ===================================================== */

        #fileInfo {

            width:
                100%;

            max-width:
                600px;

            padding:
                12px;

            background:
                #070d1f;

            border:
                1px solid #1e3a5f;

            border-radius:
                8px;

            color:
                #94a3b8;

            line-height:
                1.6;

        }


        /* =====================================================
           MEDIA PREVIEW
        ===================================================== */

        #mediaPreview {

            width:
                100%;

            min-height:
                120px;

            padding:
                15px;

            background:
                #02040a;

            border:
                1px dashed #334c75;

            border-radius:
                10px;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            overflow:
                hidden;

        }


        #mediaPreview:empty::before {

            content:
                "Original image preview will appear here";

            color:
                #64748b;

            text-align:
                center;

        }


        #mediaPreview img {

            display:
                block;

            max-width:
                100%;

            max-height:
                400px;

            width:
                auto;

            height:
                auto;

            object-fit:
                contain;

        }


        /* =====================================================
           BUTTON
        ===================================================== */

        button {

            padding:
                12px 24px;

            border:
                none;

            border-radius:
                8px;

            background:
                #0284c7;

            color:
                white;

            font-size:
                16px;

            font-weight:
                bold;

            cursor:
                pointer;

            transition:
                0.2s;

        }


        button:hover {

            background:
                #0369a1;

            transform:
                translateY(-1px);

        }


        button:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;

            transform:
                none;

        }


        /* =====================================================
           HOLOGRAM PREVIEW
        ===================================================== */

        #preview {

            text-align:
                center;

        }


        #preview h2 {

            text-align:
                left;

        }


        /* =====================================================
           LED CANVAS
        ===================================================== */

        #ledCanvas {

            display:
                block;

            width:
                512px;

            height:
                512px;

            max-width:
                100%;

            margin:
                20px auto;

            background:
                #000000;

            border:
                2px solid #38bdf8;

            border-radius:
                10px;

            image-rendering:
                pixelated;

            box-shadow:
                0 0 25px rgba(
                    56,
                    189,
                    248,
                    0.2
                );

        }


        /* =====================================================
           HOLOGRAM INFORMATION
        ===================================================== */

        #hologramInfo {

            width:
                100%;

            max-width:
                700px;

            margin:
                20px auto 0;

            padding:
                18px;

            background:
                #070d1f;

            border:
                1px solid #1e3a5f;

            border-radius:
                10px;

            text-align:
                left;

        }


        #hologramInfo h3 {

            margin-top:
                0;

            color:
                #38bdf8;

        }


        #hologramInfo p {

            margin:
                8px 0;

            color:
                #cbd5e1;

        }


        /* =====================================================
           SAVED HOLOGRAMS
        ===================================================== */

        #savedHolograms {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        250px,
                        1fr
                    )
                );

            gap:
                20px;

        }


        /* =====================================================
           SAVED CARD
        ===================================================== */

        .saved-card {

            padding:
                20px;

            background:
                #070d1f;

            border:
                1px solid #1e3a5f;

            border-radius:
                12px;

            transition:
                0.2s;

        }


        .saved-card:hover {

            border-color:
                #38bdf8;

            transform:
                translateY(-2px);

        }


        .saved-card h3 {

            margin-top:
                0;

            color:
                #38bdf8;

            word-break:
                break-word;

        }


        .saved-card p {

            color:
                #94a3b8;

            margin:
                8px 0;

        }


        .saved-card button {

            margin-top:
                10px;

            width:
                100%;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            padding:
                20px;

            text-align:
                center;

            color:
                #64748b;

            border-top:
                1px solid #1e293b;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (
            max-width: 600px
        ) {

            header h1 {

                font-size:
                    26px;

            }


            main {

                padding:
                    20px 12px;

            }


            section {

                padding:
                    18px;

            }


            #ledCanvas {

                width:
                    100%;

                height:
                    auto;

                aspect-ratio:
                    1 / 1;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <h1>
            HoloNova
        </h1>

        <p>
            Hologram Image to LED Matrix Studio
        </p>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             UPLOAD SECTION
        ================================================== -->

        <section id="uploadSection">

            <h2>
                Upload Hologram
            </h2>


            <div class="upload-area">

                <p>
                    Select an image to convert
                    into a 128 × 128 LED matrix.
                </p>


                <!-- FILE INPUT -->

                <input
                    type="file"
                    id="fileInput"
                    accept="image/jpeg,image/png,image/gif,image/webp"
                >


                <!-- FILE INFORMATION -->

                <div id="fileInfo">

                    No image selected.

                </div>


                <!-- ORIGINAL IMAGE PREVIEW -->

                <div id="mediaPreview">

                </div>


                <!-- PROCESS BUTTON -->

                <button
                    type="button"
                    id="uploadBtn"
                    style="display:none;"
                >

                    Process Hologram

                </button>

            </div>

        </section>



        <!-- =================================================
             HOLOGRAM PREVIEW
        ================================================== -->

        <section id="preview">

            <h2>
                Hologram Preview
            </h2>


            <!-- LED MATRIX -->

            <canvas
                id="ledCanvas"
                width="512"
                height="512"
            ></canvas>


        </section>



        <!-- =================================================
             SAVED HOLOGRAMS
        ================================================== -->

        <section>

            <h2>
                Saved Holograms
            </h2>


            <div id="savedHolograms">

                <p>
                    Loading holograms...
                </p>

            </div>

        </section>


    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        HoloNova © 2026

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="./app.js"></script>


</body>

</html>
